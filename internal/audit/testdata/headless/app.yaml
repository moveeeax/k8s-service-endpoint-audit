apiVersion: v1
kind: Service
metadata:
  name: legacy-db
  namespace: data
spec:
  clusterIP: None
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: external-cache
  namespace: data
spec:
  ports:
    - port: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-cache
  namespace: data
subsets:
  - addresses:
      - ip: 10.4.0.9
    ports:
      - port: 6379
