apiVersion: v1
kind: Service
metadata:
  name: metrics
  namespace: obs
spec:
  selector:
    app: exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: telemetry
    - name: admin
      port: 9101
      targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
  namespace: obs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exporter
  template:
    metadata:
      labels:
        app: exporter
    spec:
      containers:
        - name: exporter
          image: prom/node-exporter:v1.8.2
          ports:
            - name: metrics
              containerPort: 9100
